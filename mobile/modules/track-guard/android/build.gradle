apply plugin: 'com.android.library'

group = 'expo.modules.trackguard'
version = ''

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.trackguard"
  defaultConfig {
    versionCode 1
    versionName ""
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  /**
   * Беремо виконавця BackgroundTaskWork у самого expo-background-task, а не
   * пишемо власного: уся машинерія підняття JS лишається за ним, ми міняємо
   * лише умову запуску (там намертво стоїть NetworkType.CONNECTED).
   */
  implementation project(':expo-background-task')

  /**
   * androidx.work доводиться оголошувати ЯВНО, хоч expo-background-task його
   * теж тягне: у нього це `implementation`, а така залежність не потрапляє в
   * classpath споживача. Без цього рядка збірка падає на Gradle — саме на
   * цьому вона й впала першого разу.
   *
   * Версія та сама, що в нього (android/build.gradle:10). Розійтися їм не
   * можна: BackgroundTaskWork зібраний саме під неї.
   */
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
}

